<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sign In — StudyPath</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css', v='20260908v3') }}">
</head>
<body class="auth-body">
    <div class="auth-layout">
        <!-- Top Navigation -->
        <header class="auth-header">
            <div class="auth-logo">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                    <line x1="16" y1="2" x2="16" y2="6"></line>
                    <line x1="8" y1="2" x2="8" y2="6"></line>
                    <line x1="3" y1="10" x2="21" y2="10"></line>
                </svg>
                <span class="auth-logo-text">StudyPath</span>
            </div>
            <button class="theme-toggle-btn" id="themeToggle" title="Toggle color theme" aria-label="Toggle color theme">
                <svg class="sun-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="5"></circle>
                    <line x1="12" y1="1" x2="12" y2="3"></line>
                    <line x1="12" y1="21" x2="12" y2="23"></line>
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                    <line x1="1" y1="12" x2="3" y2="12"></line>
                    <line x1="21" y1="12" x2="23" y2="12"></line>
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                </svg>
                <svg class="moon-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                </svg>
            </button>
        </header>

        <!-- Centered Login Box -->
        <main class="auth-main">
            <div class="auth-box">
                <div class="auth-box-header">
                    <h2>Sign In</h2>
                    <p>Enter your owner credentials to access the study scheduler.</p>
                </div>

                {% with messages = get_flashed_messages(with_categories=true) %}
                    {% if messages %}
                        <div class="auth-alert-container">
                            {% for category, message in messages %}
                                <div class="auth-alert auth-alert-{{ category }}">
                                    <span>{{ message }}</span>
                                </div>
                            {% endfor %}
                        </div>
                    {% endif %}
                {% endwith %}

                <form class="auth-form" id="authForm" method="POST" action="{{ url_for('login', next=request.args.get('next')) }}">
                    <div class="form-group">
                        <label for="email">Authorized Email</label>
                        <input 
                            type="email" 
                            id="email" 
                            name="email" 
                            placeholder="name@domain.com" 
                            value="{{ prefill_email or '' }}"
                            required 
                            autofocus 
                            autocomplete="username"
                            spellcheck="false"
                        >
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <div class="input-password-wrapper">
                            <input 
                                type="password" 
                                id="password" 
                                name="password" 
                                placeholder="••••••••••••" 
                                required 
                                autocomplete="current-password"
                            >
                            <button type="button" class="btn-pwd-toggle" id="togglePasswordBtn" title="Show/Hide Password" aria-label="Toggle password visibility">
                                <svg class="eye-icon-show" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>
                                <svg class="eye-icon-hide" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display: none;">
                                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                                    <line x1="1" y1="1" x2="23" y2="23"></line>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <button type="submit" class="btn-primary auth-btn-submit" id="submitBtn">
                        <span class="btn-label">Continue</span>
                        <span class="btn-spinner" style="display: none;">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="12" cy="12" r="10" stroke-dasharray="32" stroke-dashoffset="12"></circle>
                            </svg>
                        </span>
                    </button>
                </form>

                <div class="auth-box-footer">
                    <span>3rd Year, 1st Semester • 7 Units</span>
                </div>
            </div>
        </main>
    </div>

    <script>
        // Theme initialization
        const savedTheme = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', savedTheme);

        const themeToggle = document.getElementById('themeToggle');
        if (themeToggle) {
            themeToggle.addEventListener('click', () => {
                const currentTheme = document.documentElement.getAttribute('data-theme');
                const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
                document.documentElement.setAttribute('data-theme', newTheme);
                localStorage.setItem('theme', newTheme);
            });
        }

        // Password visibility toggle
        const togglePasswordBtn = document.getElementById('togglePasswordBtn');
        const passwordInput = document.getElementById('password');
        if (togglePasswordBtn && passwordInput) {
            togglePasswordBtn.addEventListener('click', () => {
                const isPassword = passwordInput.type === 'password';
                passwordInput.type = isPassword ? 'text' : 'password';
                const showIcon = togglePasswordBtn.querySelector('.eye-icon-show');
                const hideIcon = togglePasswordBtn.querySelector('.eye-icon-hide');
                if (showIcon && hideIcon) {
                    showIcon.style.display = isPassword ? 'none' : 'block';
                    hideIcon.style.display = isPassword ? 'block' : 'none';
                }
            });
        }

        // Submit state
        const authForm = document.getElementById('authForm');
        const submitBtn = document.getElementById('submitBtn');
        if (authForm && submitBtn) {
            authForm.addEventListener('submit', () => {
                submitBtn.disabled = true;
                const label = submitBtn.querySelector('.btn-label');
                const spinner = submitBtn.querySelector('.btn-spinner');
                if (label) label.textContent = 'Signing in...';
                if (spinner) spinner.style.display = 'inline-block';
            });
        }
    </script>
</body>
</html>
